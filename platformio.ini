; ESP32-C3 Zero — 2× FS90R drive + FS90 pan + HC-SR04
; First step: c3_autonomous (on-board, no VM). Later: c3_mini_wifi / serial + ROS.

[platformio]
default_envs = c3_autonomous
extra_configs =
    platformio_private.ini

[env:c3_solo]
; Pin platform — this project uses Arduino-ESP32 3.x (LEDC API, etc).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
  framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
  madhephaestus/ESP32Servo @ ^3.0.5
extra_scripts =
  pre:extra_scripts/patch_esp32servo.py
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3_autonomous]
extends = env:c3_solo
build_src_filter = +<autonomous_main.cpp> +<drive_servos.cpp> +<ultrasonic.cpp> +<pan_servo.cpp> +<servo_hw.cpp> +<bot_status_led.cpp> +<bot_front_bar.cpp> +<mpu6050_imu.cpp> -<bot_main.cpp> -<bench_main.cpp>

[env:c3_base]
extends = env:c3_solo
lib_deps =
  https://github.com/micro-ROS/micro_ros_platformio
  madhephaestus/ESP32Servo @ ^3.0.5
  adafruit/Adafruit NeoPixel @ ^1.12.0
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
build_flags =
  -D OLED_ENABLED=1

[env:c3_mini_wifi]
extends = env:c3_base
extra_scripts =
  pre:extra_scripts/micro_ros_sanitize.py
  pre:extra_scripts/micro_ros_meta_rebuild.py
build_src_filter = +<bot_main.cpp> +<drive_servos.cpp> +<ultrasonic.cpp> +<pan_servo.cpp> +<servo_hw.cpp> +<mpu6050_imu.cpp> +<ir_beacon.cpp> +<ir_tx.cpp> +<bot_status_led.cpp> +<bot_front_bar.cpp> +<bot_ota.cpp> +<battery.cpp> +<bot_power.cpp> +<oled_ssd1306.cpp> -<bench_main.cpp> -<drive_cli.cpp>
build_flags =
  ${env:c3_base.build_flags}
  -DMICRO_ROS_WIFI=1
  ${wifi.build_flags}
board_microros_transport = wifi
board_microros_distro = jazzy
board_microros_user_meta = metas/colcon_mini.meta

[env:c3_mini_wifi_ota]
extends = env:c3_mini_wifi
build_flags =
  ${env:c3_mini_wifi.build_flags}
  -DENABLE_OTA=1
  ${ota.build_flags}
upload_protocol = espota
upload_port = ${ota.upload_port}
upload_flags =
  --timeout=120

; First flash only — same firmware, USB esptool (OTA not running yet).
[env:c3_mini_wifi_ota_usb]
extends = env:c3_mini_wifi_ota
upload_protocol = esptool
upload_port =
upload_flags =

[ota]
; Override in platformio_private.ini — e.g. c3-bot1 / c3-bot1.local
upload_port = c3-bot1.local
build_flags =
  -DBOT_OTA_HOSTNAME=\"c3-bot1\"

[env:c3_mini_serial]
extends = env:c3_base
extra_scripts =
  pre:extra_scripts/micro_ros_sanitize.py
  pre:extra_scripts/micro_ros_meta_rebuild.py
build_src_filter = +<bot_main.cpp> +<drive_servos.cpp> +<ultrasonic.cpp> +<pan_servo.cpp> +<servo_hw.cpp> +<mpu6050_imu.cpp> +<ir_beacon.cpp> +<ir_tx.cpp> +<bot_status_led.cpp> +<bot_front_bar.cpp> +<bot_ota.cpp> +<battery.cpp> +<bot_power.cpp> -<bench_main.cpp> -<drive_cli.cpp>
build_flags =
  ${env:c3_base.build_flags}
board_microros_transport = serial
board_microros_distro = jazzy
board_microros_user_meta = metas/colcon_mini.meta

[env:c3_bench]
extends = env:c3_solo
build_src_filter = +<bench_main.cpp> +<drive_servos.cpp> +<drive_cli.cpp> +<ultrasonic.cpp> +<pan_servo.cpp> +<servo_hw.cpp> +<bot_status_led.cpp> +<bot_front_bar.cpp> +<mpu6050_imu.cpp> +<ir_beacon.cpp> +<ir_tx.cpp> +<battery.cpp> -<bot_main.cpp> -<autonomous_main.cpp> -<bot_power.cpp>

[wifi]
build_flags =
